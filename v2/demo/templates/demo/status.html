<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>決済状態確認</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #222; }
        h1 { font-size: 1.6rem; }
        .panel { background: #f8f8f8; padding: 20px; border-radius: 8px; margin-bottom: 16px; }
        dt { font-size: 0.85rem; color: #666; margin-top: 8px; }
        dd { margin: 0 0 8px 0; font-weight: 600; }
        .status { padding: 12px 16px; border-radius: 6px; font-weight: 600; display: inline-block; }
        .status-succeeded { background: #e8f5e9; color: #1b5e20; }
        .status-pending { background: #e3f2fd; color: #0d47a1; }
        .status-canceled, .status-expired { background: #fff3e0; color: #e65100; }
        .status-refunded { background: #f3e5f5; color: #6a1b9a; }
        .status-not_found { background: #ffebee; color: #b71c1c; }
        a { color: #1976d2; }
    </style>
</head>
<body>
    <h1>決済状態確認</h1>

    <div class="panel">
        <dl>
            <dt>order_id</dt>
            <dd>{{ order_id|default:"(未指定)" }}</dd>
            <dt>status</dt>
            <dd>
                {% if status %}
                    <span class="status status-{{ status.value }}">{{ status.value }}</span>
                {% else %}
                    -
                {% endif %}
            </dd>
        </dl>
    </div>

    <p><a href="{% url 'demo:index' %}">← demo トップに戻る</a></p>
</body>
</html>
